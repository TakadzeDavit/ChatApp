koin-compiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koin-plugin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[bundles]
coil = [
    "coil",
    "coil-svg",
    "coil-compose"
]
room = [
    "room-runtime",
    "room-ktx",
    "room-compiler"
]
koin = [
    "koin-core",
    "koin-android",
    "koin-androidx-compose",
    "koin-annotations"
]
test = [
    "junit",
    "google-truth",
    "mockk",
    "kotlinx-coroutines-test",
    "turbine"
]